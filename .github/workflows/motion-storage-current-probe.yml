name: Temporary motion storage controls
on:
  push:
    branches: [codex/motion-storage-current-probe]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        chrome: ['153.0.8010.36', '153.0.8010.47']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        id: chrome
        with:
          chrome-version: ${{ matrix.chrome }}
          install-dependencies: true
      - run: node scripts/motion-storage-current-probe.mjs
        env:
          ARCHIFY_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: storage-controls-${{ matrix.chrome }}
          path: motion-storage-current-observations.json
          if-no-files-found: error
